name: Compile LaTeX Documents

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.tex'
      - 'shared/author.json'
      - 'shared/theme/**'
      - 'shared/bibliographies/**'
      - 'scripts/validate_author_metadata.py'
  pull_request:
    branches: [ main ]
    paths:
      - '**.tex'
      - 'shared/author.json'
      - 'shared/theme/**'
      - 'shared/bibliographies/**'
      - 'scripts/validate_author_metadata.py'
  workflow_dispatch:

jobs:
  validate-author-metadata:
    name: Validate Author Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate canonical author metadata
        run: python scripts/validate_author_metadata.py

  compile-presentations:
    name: Compile All Presentations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        presentation:
          - 00-programming-fundamentals/r-programming/presentation/R_programming
          - 01-foundations/feature-engineering/presentation/feature_engineering_beamer
          - 01-foundations/optimization/presentation/optimization_beamer
          - 01-foundations/pca/presentation/pca
          - 01-foundations/statistical-modeling/presentation/diogo_ribeiro_beamer_extended
          - 01-foundations/statistical-modeling/presentation/statistical_modeling_beamer
          - 02-deep-learning/deep-learning-fundamentals/presentation/deep_learning_beamer
          - 02-deep-learning/reinforcement-learning/presentation/rl_beamer
          - 03-bayesian-methods/bayesian-machine-learning/presentation/bayesian_ml_beamer
          - 03-bayesian-methods/mcmc/presentation/mcmc_beamer
          - 04-causal-inference/ab-testing/presentation/a_b_testing_interview
          - 04-causal-inference/causal-inference-fundamentals/presentation/causal_inference_beamer
          - 05-time-series/time-series-forecasting/presentation/ARMA_processes
          - 05-time-series/time-series-forecasting/presentation/stationary_ergodicity
          - 05-time-series/time-series-forecasting/presentation/time_series_beamer
          - 06-advanced-topics/ai-agents/presentation/ai_agents_beamer
          - 06-advanced-topics/computer-science/presentation/object_oriented_programming
          - 06-advanced-topics/computer-science/presentation/streaming_pipeline_processing
          - 06-advanced-topics/explainable-ai/presentation/interpretability_beamer
          - 08-data-science-applications-course/presentation/main_presentation
          - shared/theme/template_presentation
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.presentation }}.tex
          work_in_root_file_dir: true
          args: -pdf -interaction=nonstopmode -halt-on-error
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
        env:
          TEXINPUTS: ".:$GITHUB_WORKSPACE//:"

      - name: Build presentation artifact name
        if: success()
        id: presentation_artifact
        env:
          PRESENTATION_PATH: ${{ matrix.presentation }}
        run: |
          safe_name=$(echo "$PRESENTATION_PATH" | tr '/\\' '-')
          echo "name=${safe_name}-pdf" >> "$GITHUB_OUTPUT"
      - name: Upload presentation PDF artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ steps.presentation_artifact.outputs.name }}
          path: ${{ matrix.presentation }}.pdf
          retention-days: 30

  compile-exercises:
    name: Compile Exercise Sets
    runs-on: ubuntu-latest

    strategy:
      matrix:
        exercise:
          - 03-bayesian-methods/mcmc/exercises/mcmc_exercises
          - 04-causal-inference/causal-inference-fundamentals/exercises/causal_inference_exercises
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.exercise }}.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
        env:
          TEXINPUTS: ".:$GITHUB_WORKSPACE//:"

      - name: Build exercise artifact name
        if: success()
        id: exercise_artifact
        env:
          EXERCISE_PATH: ${{ matrix.exercise }}
        run: |
          safe_name=$(echo "$EXERCISE_PATH" | tr '/\\' '-')
          echo "name=${safe_name}-pdf" >> "$GITHUB_OUTPUT"
      - name: Upload exercise PDF artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ steps.exercise_artifact.outputs.name }}
          path: ${{ matrix.exercise }}.pdf
          retention-days: 30

  create-release:
    name: Create Release with PDFs
    needs: [validate-author-metadata, compile-presentations, compile-exercises]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: compiled-pdfs

      - name: Display structure of downloaded files
        run: ls -R compiled-pdfs

      - name: Create timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.timestamp.outputs.timestamp }}
          name: Automated Build ${{ steps.timestamp.outputs.timestamp }}
          body: |
            Automatically compiled PDFs from latest commit.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ steps.timestamp.outputs.timestamp }}

            This release contains all compiled presentations and exercise sets.
          files: compiled-pdfs/**/*.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compilation-status:
    name: Report Compilation Status
    needs: [validate-author-metadata, compile-presentations, compile-exercises]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check compilation status
        run: |
          if [ "${{ needs.validate-author-metadata.result }}" == "success" ] && [ "${{ needs.compile-presentations.result }}" == "success" ] && [ "${{ needs.compile-exercises.result }}" == "success" ]; then
            echo "✅ All documents compiled and metadata validated successfully!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Author metadata: ${{ needs.validate-author-metadata.result }}"
            echo "Presentations: ${{ needs.compile-presentations.result }}"
            echo "Exercises: ${{ needs.compile-exercises.result }}"
            exit 1
          fi

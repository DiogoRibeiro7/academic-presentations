name: Normalize Beamer Sources

on:
  push:
    branches:
      - refactor/standardize-beamer-preamble
    paths:
      - '**.tex'
      - 'scripts/normalize_beamer_preambles.py'
      - '.github/workflows/normalize-beamer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/standardize-beamer-preamble

      - name: Normalize Beamer preambles
        run: python scripts/normalize_beamer_preambles.py --write

      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.tex'
          git commit -m "refactor: normalize all Beamer preambles"
          git push origin HEAD:refactor/standardize-beamer-preamble

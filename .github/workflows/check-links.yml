name: Check Links

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-markdown-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check links in Markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
          folder-path: '.'
          max-depth: -1
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          base-branch: main

  check-bibtex-dois:
    name: Check BibTeX DOI Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine bibliography scope
        id: bibliography-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope_file="$RUNNER_TEMP/bib-files.txt"
          : > "$scope_file"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'shared/bibliographies/*.bib' > "$scope_file"
          else
            find shared/bibliographies -maxdepth 1 -type f -name '*.bib' | sort > "$scope_file"
          fi

          if [ -s "$scope_file" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Bibliography files to check:"
            cat "$scope_file"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No bibliography files changed in this pull request; DOI validation is not applicable."
          fi

      - name: Set up Python
        if: steps.bibliography-scope.outputs.has_files == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.bibliography-scope.outputs.has_files == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check DOI links
        if: steps.bibliography-scope.outputs.has_files == 'true'
        run: |
          python - <<'EOF'
          import os
          import re
          import requests
          import sys
          from pathlib import Path

          def extract_dois(bib_file):
              """Extract DOIs from BibTeX file."""
              with open(bib_file, 'r', encoding='utf-8') as f:
                  content = f.read()
              doi_pattern = r'doi\s*=\s*{([^}]+)}'
              return re.findall(doi_pattern, content, re.IGNORECASE)

          def check_doi(doi):
              """Check whether doi.org recognizes a DOI without visiting the publisher."""
              url = f"https://doi.org/{doi}"
              try:
                  response = requests.get(
                      url,
                      timeout=15,
                      allow_redirects=False,
                      headers={"User-Agent": "academic-presentations-link-check/1.0"},
                  )
              except requests.RequestException as exc:
                  print(f"⚠️ DOI resolver unavailable for {doi}: {exc}")
                  return None

              status = response.status_code
              if 200 <= status < 400:
                  return True
              if status in {408, 425, 429} or status >= 500:
                  print(
                      f"⚠️ DOI resolver returned HTTP {status} for {doi}; "
                      "treating this as temporarily unverifiable"
                  )
                  return None
              if 400 <= status < 500:
                  return False

              print(
                  f"⚠️ DOI resolver returned unexpected HTTP {status} for {doi}; "
                  "treating this as temporarily unverifiable"
              )
              return None

          scope_file = Path(os.environ["RUNNER_TEMP"]) / "bib-files.txt"
          bib_files = [Path(line.strip()) for line in scope_file.read_text().splitlines() if line.strip()]

          all_valid = True
          for bib_file in bib_files:
              print(f"\nChecking {bib_file}...")
              dois = extract_dois(bib_file)
              print(f"Found {len(dois)} DOIs")

              for doi in dois:
                  result = check_doi(doi)
                  if result is False:
                      print(f"❌ Invalid DOI: {doi}")
                      all_valid = False
                  elif result is None:
                      print(f"⚠️ Could not verify DOI right now: {doi}")
                  else:
                      print(f"✅ Valid DOI: {doi}")

          if not all_valid:
              print("\n❌ Some DOI links are invalid!")
              sys.exit(1)
          else:
              print("\n✅ All scoped DOI links are valid or temporarily unverifiable!")
          EOF

  check-github-urls:
    name: Check GitHub URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check GitHub URLs in documentation
        run: |
          # Find all markdown files
          markdown_files=$(find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/.git/*")

          broken_links=0

          for file in $markdown_files; do
            echo "Checking $file..."

            # Extract GitHub URLs
            urls=$(grep -oP 'https://github\.com/[^\s\)\]]+' "$file" || true)

            for url in $urls; do
              # Remove trailing punctuation/braces (common in markdown and BibTeX snippets)
              url=$(echo "$url" | sed 's/[.,;:)}]\+$//')

              # Check if URL is accessible
              status=$(curl -o /dev/null -s -w "%{http_code}" -L "$url")

              if [ "$status" -ge 400 ]; then
                echo "❌ Broken link in $file: $url (HTTP $status)"
                broken_links=$((broken_links + 1))
              else
                echo "✅ Valid link: $url"
              fi
            done
          done

          if [ $broken_links -gt 0 ]; then
            echo "❌ Found $broken_links broken link(s)"
            exit 1
          else
            echo "✅ All GitHub links are valid"
          fi

  link-check-report:
    name: Link Check Summary
    needs: [check-markdown-links, check-bibtex-dois, check-github-urls]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Link Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Links | ${{ needs.check-markdown-links.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BibTeX DOIs | ${{ needs.check-bibtex-dois.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub URLs | ${{ needs.check-github-urls.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Overall status
        run: |
          if [ "${{ needs.check-markdown-links.result }}" == "success" ] && \
             [ "${{ needs.check-bibtex-dois.result }}" == "success" ] && \
             [ "${{ needs.check-github-urls.result }}" == "success" ]; then
            echo "✅ All link checks passed!"
            exit 0
          else
            echo "❌ Some link checks failed"
            exit 1
          fi
